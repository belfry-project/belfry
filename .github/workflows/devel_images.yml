---
name: Build/Push Development Images
env:
  LC_ALL: "C.UTF-8" # prevent ERROR: Ansible could not initialize the preferred locale: unsupported locale setting
  DOCKER_CACHE: "--no-cache" # using the cache will not rebuild git requirements and other things
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature_*
jobs:
  push-development-images:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.repository == 'belfry-project/belfry' && (github.ref_name == 'main' || startsWith(github.ref_name, 'feature_')))
    # Each architecture is built on a native runner and pushed as <tag>-<arch>.
    # The merge job below combines them into the multi-arch <tag>.
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 120
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch:
          - {platform: linux/amd64, runner: ubuntu-latest, suffix: amd64}
          - {platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64}
        build-targets:
          - image-name: awx_devel
            make-target: docker-compose-buildx
          - image-name: awx_kube_devel
            make-target: awx-kube-dev-buildx
          - image-name: awx
            make-target: awx-kube-buildx
    steps:

      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set GITHUB_ENV variables
        run: |
          echo "DEV_DOCKER_TAG_BASE=ghcr.io/${OWNER,,}" >> $GITHUB_ENV
          echo "COMPOSE_TAG=${GITHUB_REF##*/}-${{ matrix.arch.suffix }}" >> $GITHUB_ENV
          echo "PLATFORMS=${{ matrix.arch.platform }}" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'

      - uses: ./.github/actions/setup-python

      - name: Log in to registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Setup node and npm for the new UI build
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
        if: matrix.build-targets.image-name == 'awx'

      - name: Prebuild new UI for awx image (to speed up build process)
        run: |
          make ui
        if: matrix.build-targets.image-name == 'awx'

      - uses: ./.github/actions/setup-ssh-agent
        with:
          ssh-private-key: ${{ secrets.PRIVATE_GITHUB_KEY }}

      - name: Build and push AWX devel images
        run: |
          make ${{ matrix.build-targets.make-target }}

  merge-development-images:
    needs: push-development-images
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image-suffix: ['', '_devel', '_kube_devel']
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Create and push the multi-arch image
        id: tags
        env:
          OWNER: '${{ github.repository_owner }}'
          REPO: '${{ github.event.repository.name }}'
        run: |
          image="ghcr.io/${OWNER,,}/${REPO}${{ matrix.image-suffix }}"
          tag="${GITHUB_REF##*/}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools create \
            --tag "${image}:${tag}" \
            --annotation="index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            "${image}:${tag}-amd64" "${image}:${tag}-arm64"
          docker buildx imagetools inspect "${image}:${tag}"

      - name: Get the image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.tag }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Signed statement of which repository, commit and workflow built the image.
      # Verify with: gh attestation verify oci://<image> --owner belfry-project
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.tags.outputs.image }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
