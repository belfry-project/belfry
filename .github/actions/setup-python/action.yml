name: 'Setup Python from Makefile'
description: 'Extract and set up Python version from Makefile'
inputs:
  python-version:
    description: 'Override Python version (optional)'
    required: false
    default: ''
  working-directory:
    description: 'Directory containing the Makefile'
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - name: Get python version from Makefile
      shell: bash
      run: |
        if [ -n "${{ inputs.python-version }}" ]; then
          echo "py_version=${{ inputs.python-version }}" >> $GITHUB_ENV
        else
          cd ${{ inputs.working-directory }}
          py_version=`make PYTHON_VERSION`
          # The Makefile falls back to a bare "python3" when the runner has no
          # python3.14 or python3.12, which would make setup-python install the
          # newest 3.x. Use the version AWX requires instead.
          if ! [[ "$py_version" =~ ^3\.[0-9]+$ ]]; then
            py_version=3.14
          fi
          echo "py_version=$py_version" >> $GITHUB_ENV
        fi
    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.py_version }}
