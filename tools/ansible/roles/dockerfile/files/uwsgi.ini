[uwsgi]
socket = 127.0.0.1:8050
processes = 5
master = true
vacuum = true
no-orphans = true
lazy-apps = true
manage-script-name = true
master-fifo = /var/lib/awx/awxfifo
max-requests = 1000
buffer-size = 32768

harakiri = 115
harakiri-graceful-timeout = 110
harakiri-graceful-signal = 6
# py-call-osafterfork lets Python catch the graceful harakiri signal, but makes
# workers abort at start on Python 3.13 and newer (unbit/uwsgi#2710). Without it,
# harakiri still stops the worker; only the debug log of the request is lost.

if-env = UWSGI_MOUNT_PATH
mount = %(_)=awx.wsgi:application
endif =

if-not-env = UWSGI_MOUNT_PATH
mount = /=awx.wsgi:application
endif =
